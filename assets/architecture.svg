<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #f8fafc; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .tag { font-size: 10px; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>

  <rect width="860" height="420" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Controls -->
  <circle cx="36" cy="36" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="54" cy="36" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="72" cy="36" r="6" fill="#10b981" opacity="0.8"/>
  <text x="100" y="41" class="mono" fill="#64748b">agent-immune-system // Genetic Fuzzer &amp; AST Firewall</text>

  <!-- Left: Attacker / Fuzzer -->
  <g transform="translate(40, 80)">
    <rect width="230" height="240" rx="10" fill="#1f1315" stroke="#991b1b"/>
    <rect x="14" y="14" width="130" height="20" rx="4" fill="#ef4444" opacity="0.2"/>
    <text x="22" y="28" class="tag" fill="#f87171">GENETIC FUZZER</text>

    <text x="14" y="65" class="mono" fill="#fca5a5">- Zero-Width Steganography</text>
    <text x="14" y="90" class="mono" fill="#fca5a5">- Cyrillic Homoglyphs</text>
    <text x="14" y="115" class="mono" fill="#fca5a5">- Base64 Instruction Wrappers</text>
    <text x="14" y="140" class="mono" fill="#fca5a5">- Markdown Polyglot Breaks</text>

    <line x1="14" y1="160" x2="216" y2="160" stroke="#7f1d1d"/>
    <text x="14" y="185" class="tag" fill="#f87171">ATTACK INJECTION:</text>
    <text x="14" y="205" class="mono" fill="#fda4af">"DROP TABLE users; --"</text>
  </g>

  <!-- Arrow to Agent -->
  <path d="M 270 200 L 320 200" stroke="#ef4444" stroke-width="2"/>

  <!-- Middle: Compromised LLM Reasoning Layer -->
  <g transform="translate(320, 80)">
    <rect width="210" height="240" rx="10" fill="#1e1824" stroke="#a855f7"/>
    <rect x="14" y="14" width="130" height="20" rx="4" fill="#a855f7" opacity="0.2"/>
    <text x="22" y="28" class="tag" fill="#c084fc">LLM CONTEXT</text>

    <text x="14" y="65" class="mono" fill="#d8b4fe">Prompt Gaslighting:</text>
    <text x="14" y="85" class="mono" fill="#e9d5ff">"System mode override"</text>

    <rect x="14" y="120" width="182" height="60" rx="6" fill="#3b0764"/>
    <text x="22" y="140" class="tag" fill="#f472b6">LLM WAS TRICKED!</text>
    <text x="22" y="160" class="mono" fill="#f5d0fe">Calls tool: sql_exec(...)</text>
  </g>

  <!-- Arrow to Wall -->
  <path d="M 530 200 L 580 200" stroke="#f43f5e" stroke-width="2"/>

  <!-- Right: AST Tool Membrane (Firewall) -->
  <g transform="translate(580, 80)">
    <rect width="240" height="240" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="14" y="14" width="140" height="20" rx="4" fill="#0284c7" opacity="0.2"/>
    <text x="22" y="28" class="tag" fill="#38bdf8">AST INVARIANT WALL</text>

    <text x="14" y="65" class="mono" fill="#94a3b8">Outside LLM context</text>

    <!-- Blocked badge -->
    <rect x="14" y="95" width="212" height="60" rx="6" fill="#1e131d" stroke="#ef4444"/>
    <text x="24" y="118" class="title" fill="#f87171">EXECUTION BLOCKED</text>
    <text x="24" y="136" class="mono" fill="#fca5a5">Violated DDL Invariant</text>

    <text x="14" y="185" class="mono" fill="#10b981">[+] File System Safe</text>
    <text x="14" y="205" class="mono" fill="#10b981">[+] Database Protected</text>
  </g>

  <!-- Bottom banner -->
  <rect x="40" y="340" width="780" height="45" rx="6" fill="#0c1322" stroke="#1e293b"/>
  <circle cx="58" cy="362" r="4" fill="#38bdf8"/>
  <text x="74" y="366" class="mono" fill="#cbd5e1">Deterministic Tool Guard: Tokens parsed via shlex/AST before execution boundary</text>
</svg>
